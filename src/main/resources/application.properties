# ==========================================
# SHARED CONFIGURATION (ALL ENVIRONMENTS)
# ==========================================

# =========================
# APPLICATION
# =========================
spring.application.name=quiz-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =========================
# DATABASE - SHARED CONFIG
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=QuizServiceHikariPool

# =========================
# JPA/HIBERNATE - SHARED CONFIG
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Timezone - UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# =========================
# FILE UPLOAD - Excel import
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# LOGGING - SHARED PATTERN
# =========================
spring.output.ansi.enabled=ALWAYS

# JWT Configuration - REFACTORED
# QuizService läser INTE JWT tokens längre!
# Gateway validerar JWT och sätter X-User-Id, X-User-Email, X-User-Role headers
# QuizService läser dessa headers via GatewayHeaderAuthenticationFilter

# Service-to-Service API Key (for internal calls from ExamService)
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}

# Actuator Configuration (Health checks & Monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
