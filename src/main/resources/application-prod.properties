# ==========================================
# PRODUCTION PROFILE (Railway/Docker/Kubernetes)
# ==========================================

# =========================
# DATABASE - DEDICATED FOR QUIZ SERVICE
# =========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:mysql-quiz}:${MYSQLPORT:3306}/${MYSQLDATABASE:quizServiceDb}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}

# =========================
# SERVER
# =========================
server.port=${PORT:8085}

# =========================
# EUREKA - ENABLED
# =========================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${SERVICE_NAME:quiz-service}
eureka.instance.non-secure-port=8085
eureka.instance.instance-id=${eureka.instance.hostname}:${server.port}

# =========================
# LOGGING - INFO
# =========================
logging.level.com.example.quizService=INFO
logging.level.org.springframework.web=INFO

# =========================
# JPA - HIDE SQL
# =========================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
